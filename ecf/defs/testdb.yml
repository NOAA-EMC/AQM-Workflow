---
 suite:
   name: nco_aqm
   family:
     name: primary
     family:
       name: cyc
       task:
         name: cycle_end
         cron: 23:00
       family:
         name: aqm
         family:
           name: v1.0
           family:
             name: nexus
             task:
               name: jaqm_nexus_emission_master
               NSPT_Arr: [0, 01, 02, 03, 04, 05]
             task:
               name: jaqm_nexus_post_split
               trigger: ./jaqm_nexus_emission_master==complete
             family:
               name: prep
               task:
                 name: jaqm_make_ics
               task:
                 name: jaqm_make_lbcs
               task:
                 name: jaqm_ics
                 trigger: ./jaqm_make_ics==compelte
               task:
                 name: jaqm_lbcs
                 trigger: ./jaqm_make_lbcs==complete and ./jaqm_make_ics==complete
               family:
                 name: pts_fire_emis
                 task:
                   name: jaqm_point_source
                 task:  
                   name: jaqm_fire_emission
               family:
                 name: forecast
                 task:
                   name: jaqm_forecast
                 trigger: ../nexus==complete and ../prep==complete and ../pts_fire_emis==complete
                 event:
                   name: release_manager
                   num: 1
                 task:
                   name: jaqm_forecast_manager
                   trigger: ./jaqm_forecast:release_manager
                   event:
                     name: restart_gp1_rdy
                     num: 1
                   event:
                     name: fh_rdy
                     num: 2
                 family:
                   name: post
                   task:
                     name: jaqm_post_master
                     FHR: [000, 001, 002, 003, 004, 005, 006]
                     trigger: ../forecast==complete
                 family:
                   name: product
                   task:
                     name: jaqm_pre_post_stat
                     trigger: ../forecast==complete
                   task:
                     name: jaqm_post_stat_o3
                     trigger: ./jaqm_pre_post_stat==complete
                   task:
                     name: jaqm_post_stat_pm25
                     trigger: ./jaqm_pre_post_stat==complete
                   task:
                     name: jaqm_bias_correction_o3
                     trigger: ./jaqm_pre_post_stat==complete
                   task:
                     name: jaqm_bias_correction_pm25
                     trigger: ./jaqm_pre_post_stat==complete
