---
 #Set user directory, or the current working directory will be used
 #Example user_dirs include: 
 #hera: /scratch2/NCEPDEV/naqfc/[hera_username]
 #wcoss2: /lfs/h2/[organization]/[user_group]/noscrub/[wcoss2_username]
 #gaeac6: /gpfs/f6/drsa-fire2/world-shared/[gaeac6_username]
 user_dir:
  hera:
  wcoss2:
  gaeac6: 
 #What is your group for the workflow? (example: physics, nems, etc. )
 USER_GROUP: physics
 #What is your organization? (example: emc, arl, etc. )
 ORG: emc
 #What's the start date? (YYYYMMDD)
 PDY: 20230701
 #Which mode will you be generating the workflow for, reatime or retro?
 workflow_mode: realtime
 #Which type of workflow run do you want to do? (nco, community, or testing)
 RUN_TYPE: testing
 #What version of AQM are you using? Default is v8.0.1.
 aqm_ver: v8.0.1
 #How many cycles do you want to run? (choose 00, 06, 12, or 18)
 CYC: 00
 #ecflow host (wcoss2 cactus: cdecflow01, wcoss2 dogwood: ddecflow01, gaeac6: gaea66, hera: hecflow01)
 #ECF_HOST: 
 #Change queue based on machine:(wcoss2: dev, hera:hera, gaeac6:normal)  
 QUEUE: dev
 
 #WCOSS2 ONLY SETTINGS-------------------------------
 #Default settings are provided. Change as needed. 
 PROJ: AQM
 PROJENV: DEV
 NET: aqm
 RUN: aqm
 ENVIR: dev
 QUEUE_ARCH: dev_transfer
 MACHINE_SITE: development
 
